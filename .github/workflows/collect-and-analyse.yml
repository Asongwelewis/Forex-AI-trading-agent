name: Collect

# The hourly collection pass, and only that. ADR-005 moved analysis and resolution onto the
# desktop, where MT5 runs; what is left is keeping the Twelve Data series current while that
# desktop is off, so a hole in the Exness series can be seen and deliberately plugged.
#
# The collector is not a daemon. It wakes, works for a minute and exits — so a scheduler is
# all the "deployment" it needs. No VPS, no container to keep alive, £0.
#
# Four properties of GitHub's scheduler that this file is built around:
#
#   1. **Scheduled triggers are best-effort.** A run can be delayed 30+ minutes at peak, and
#      can be dropped entirely. Harmless for collection — the next run's overlapping re-fetch
#      closes the hole — and one of the reasons the trading path does not live here. Hence
#      :07 rather than :00, off the top-of-hour rush.
#   2. **Five minutes is the floor** between runs. Irrelevant at H1; a hard limit if M5 is
#      ever wanted.
#   3. **Inactivity disables schedules** after 60 days without commits. health.yml warns at 45.
#   4. **Only the default branch's copy of this file is scheduled.** This is on a phase branch,
#      so cron does nothing until it reaches `main`. workflow_dispatch is what makes it
#      testable before then — and several people report cron not activating at all until the
#      first manual run.

on:
  schedule:
    # 07 past the hour. The top of the hour is when every cron on the platform fires at once
    # and the queue backs up; a few minutes off it measurably reduces the delay.
    #
    # This runs 24/7, which is ~744 runs a month. At 1–2 minutes each that is 750–1500 of the
    # 2,000 free Linux minutes a private repository gets. To trim it to market hours, swap the
    # single entry below for these two — FX runs Sunday 21:00 UTC to Friday 21:00 UTC, and the
    # Sunday range spans 21–23 because the New York open is 21:00 UTC in winter and 22:00 in
    # summer:
    #   - cron: '7 * * * 1-5'
    #   - cron: '7 21-23 * * 0'
    - cron: "7 * * * *"
  workflow_dispatch:

# A run must never overlap its predecessor. The collector re-fetches overlapping windows and
# upserts on `bars_unique`, so a double-write converges rather than corrupting — but two runs
# racing on the same hour still burn Twelve Data credits twice for nothing.
#
# cancel-in-progress is false on purpose: killing a run mid-write to chase the newer one is
# strictly worse than letting it finish. GitHub queues at most one pending run and discards
# older pending ones, which is the behaviour we want — a run queued two hours ago has nothing
# left to say.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    name: Hourly collection
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Store
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # Data
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      CALENDAR_USER_AGENT: ${{ vars.CALENDAR_USER_AGENT || 'fx-regime-agent/0.1' }}
      # Alerts. Only the failure notifier uses these; the collector sends nothing.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # No LLM keys. Narration belongs to the analysis pass, which is on the desktop now.
      # Runtime
      LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      # Before anything touches the network or the store. An unset secret is the empty string
      # in Actions, not an error, so without this the run dies later with a message about a
      # malformed DSN instead of one naming the secret nobody set.
      - name: Check required secrets
        env:
          REQUIRED_SECRETS: SUPABASE_DB_URL TWELVEDATA_API_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID
        run: bash .github/scripts/check-secrets.sh

      - uses: ./.github/actions/setup

      # --------------------------------------------------------------------------------
      # The pass. Short-lived and idempotent: re-running it for the same bar upserts on
      # `bars_unique` and converges, which is what makes a best-effort scheduler safe to
      # build on. A skipped hour needs no catch-up path.
      #
      # ADR-005 removed the analyse and resolve stages from this workflow. They named
      # `fxagent.analyst` and `fxagent.resolve`, neither of which has ever existed, and the
      # stage action's skip-with-a-warning behaviour meant the pass would have reported
      # success while doing nothing for two of its three stages, indefinitely. That escape
      # hatch is right for a phase about to land and wrong as a permanent state.
      #
      # They did not move to another workflow. Analysis and resolution now need a running MT5
      # terminal, which a GitHub runner does not have, so they belong to `fxagent.trader` on
      # the desktop. What is left here is the one job that genuinely wants a machine that is
      # always on: keeping the Twelve Data series current while the desktop is off, so a hole
      # in the Exness series can be seen and, deliberately, plugged.
      - name: Collect bars and events
        id: collect
        uses: ./.github/actions/stage
        with:
          module: fxagent.collector

      # --------------------------------------------------------------------------------
      # A scheduled job that silently stops firing is the main operational risk here, so the
      # failure path is part of the deliverable and not an afterthought. Plain curl, no
      # fxagent import: the notifier must not share a failure mode with the thing it reports.
      # --------------------------------------------------------------------------------
      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/notify
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          text: |
            ❌ FX agent hourly collection FAILED

            collect : ${{ steps.collect.conclusion || 'not reached' }}

            The stored series has a hole for this hour. The collector re-fetches an
            overlapping window, so a single failure self-heals on the next run; repeated
            failures do not.
            Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

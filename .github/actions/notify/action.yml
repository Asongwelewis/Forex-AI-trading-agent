name: Telegram notification
description: >
  Send one message to the configured Telegram chat. This is the only channel by which a
  scheduled run can reach a human, so it is deliberately dependency-free: plain curl, no
  Python, no import of fxagent. A notifier that shares a failure mode with the thing it
  reports on is not a notifier.

inputs:
  bot-token:
    description: TELEGRAM_BOT_TOKEN. Never echoed.
    required: true
  chat-id:
    description: TELEGRAM_CHAT_ID.
    required: true
  text:
    description: Message body, sent as plain text (no Markdown parse mode, so nothing in
      a log excerpt can be mangled into an unclosed entity and rejected by the API).
    required: true

runs:
  using: composite
  steps:
    - name: Send
      shell: bash
      env:
        BOT_TOKEN: ${{ inputs.bot-token }}
        CHAT_ID: ${{ inputs.chat-id }}
        TEXT: ${{ inputs.text }}
      # No `set -x` anywhere in here. The bot token is a path segment of the request URL,
      # so tracing the curl invocation would print it. Actions masks registered secrets in
      # log output, but that is the backstop, not the design.
      run: |
        set -uo pipefail

        if [ -z "${BOT_TOKEN}" ] || [ -z "${CHAT_ID}" ]; then
          echo "::error title=Cannot alert::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is empty, so this run has no way to reach anyone. Set both repository secrets. An unalertable scheduled job is the exact failure this workflow exists to prevent."
          exit 1
        fi

        # Strip surrounding whitespace. A secret pasted through a browser very often carries a
        # trailing newline, and it lands in the request URL path where it produces a 404 that
        # looks identical to a genuinely wrong token.
        BOT_TOKEN=$(printf '%s' "${BOT_TOKEN}" | tr -d '[:space:]')
        CHAT_ID=$(printf '%s' "${CHAT_ID}" | tr -d '[:space:]')

        # Shape check before spending a request. A malformed token is by far the most common
        # cause of a 404 here, and "HTTP 404 Not Found" gives no clue which of the two secrets
        # is at fault. The id half (before the colon) is the bot's public user id, not a
        # credential, so echoing it is safe and is the fastest way to spot the wrong bot.
        token_id=${BOT_TOKEN%%:*}
        if ! printf '%s' "${BOT_TOKEN}" | grep -qE '^[0-9]{6,16}:[A-Za-z0-9_-]{30,}$'; then
          echo "::error title=TELEGRAM_BOT_TOKEN is malformed::The secret is ${#BOT_TOKEN} characters and does not match a Telegram token (digits, a colon, then ~35 more characters). The usual cause is pasting BotFather's whole line — 'Use this token to access the HTTP API:' — instead of just the token, or copying only part of it. Re-copy the token alone."
          exit 1
        fi

        body_file=$(mktemp)
        trap 'rm -f "${body_file}"' EXIT

        # Telegram caps a message at 4096 characters and rejects longer ones outright, which
        # would turn a real alert into silence. Truncate rather than lose it — but truncate
        # carefully: `head -c` counts BYTES, and the summaries are full of multi-byte glyphs
        # (✅ is 3 bytes, 🕒 is 4). Slicing one in half makes the whole payload invalid UTF-8,
        # and Telegram answers that with "400 Bad Request: strings must be encoded in UTF-8" —
        # the alert is lost to a truncation that only bites on the longest messages, which are
        # the ones most likely to matter. `iconv -c` drops the partial sequence at the tail.
        # iconv's stderr is discarded deliberately: "incomplete character at end of buffer" is
        # not a fault here, it is the exact case -c exists to absorb, and letting it through
        # puts a scary line in the log of every long alert.
        printf '%s' "${TEXT}" | head -c 3900 | iconv -c -f UTF-8 -t UTF-8 2>/dev/null > "${body_file}"

        # `text@file` makes curl read the bytes straight off disk. Passing the message as a
        # command-line argument instead routes it through the platform's argument encoding,
        # which corrupts multi-line non-ASCII text — verified: the identical body that fails
        # as an argument succeeds byte-for-byte from a file. The file form has no such path,
        # so the payload Telegram receives is exactly what health-report.sh wrote.
        status=$(curl --silent --show-error \
          --retry 3 --retry-connrefused --retry-delay 5 \
          --max-time 30 \
          --output /tmp/telegram-response.json \
          --write-out '%{http_code}' \
          --data-urlencode "chat_id=${CHAT_ID}" \
          --data-urlencode "text@${body_file}" \
          --data "disable_web_page_preview=true" \
          "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage") || status="000"

        if [ "${status}" != "200" ]; then
          # The response body carries Telegram's own description (bad chat_id, bot blocked,
          # unauthorized). It does not contain the token, so it is safe to surface.
          detail=$(cat /tmp/telegram-response.json 2>/dev/null | head -c 500)

          # Telegram's status codes each mean one specific thing here, and the raw JSON says
          # none of it. "404 Not Found" in particular reads like a broken URL when it actually
          # means the token does not belong to any bot -- which sent us looking in the wrong
          # place once already.
          case "${status}" in
            404) hint="Telegram did not recognise the request URL. A merely wrong-but-well-formed token answers 401, not 404, so a 404 past the shape check above means TELEGRAM_BOT_TOKEN contains hidden or stray characters — a zero-width space, a smart quote, an embedded newline. It claimed bot id ${token_id}. Delete the secret and retype the token rather than pasting it." ;;
            401) hint="the token was rejected as unauthorized, which normally means it has been revoked. Issue a fresh one in BotFather." ;;
            400) hint="the request was rejected. If the description mentions 'chat not found', TELEGRAM_CHAT_ID is wrong; if it mentions UTF-8, the message body was corrupted before sending." ;;
            403) hint="the bot is not allowed to message that chat. Open Telegram and send the bot a message first -- a bot can never start a conversation -- and confirm it has not been blocked." ;;
            000) hint="no HTTP response at all, so this is a network or DNS failure reaching api.telegram.org rather than a credential problem." ;;
            *)   hint="unexpected status; the description below is Telegram's own." ;;
          esac

          echo "::error title=Telegram send failed (HTTP ${status})::${hint} Response: ${detail}"
          exit 1
        fi

        echo "Telegram message delivered (HTTP 200)."

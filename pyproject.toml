[project]
name = "fx-regime-agent"
version = "0.1.0"
description = "Session-aware forex regime agent: three uncorrelated strategies behind a regime router, executing only under an expiring permission grant."
readme = "README.md"
# The 3.12 floor originally came from pandas-ta, which is no longer a dependency (Phase 5
# teardown — the indicators are hand-written now). Kept as-is deliberately: it is the version
# the whole codebase and lockfile are built against, and widening it is a decision on its own.
# Upper bound excludes 3.13+, where several deps still lag (see docs/BUILD_PLAN.md pre-flight).
requires-python = ">=3.12,<3.13"

dependencies = [
    # NOTE: both ends of this range are now unjustified and it contradicts CLAUDE.md's stack,
    # which calls for pandas 3.0.5. The floor was pandas-ta's (dropped) and the `<3` ceiling was
    # vibe-trading-ai's, which hard rule 10 now forbids importing at all. Left pinned on purpose:
    # moving to pandas 3.x is an upgrade to run and test on its own, not part of a teardown.
    "pandas>=2.3.2,<3",
    "numpy>=2.2.6",
    "pydantic>=2",
    "python-dotenv>=1.0",
    # No in-process scheduler. Every entrypoint is short-lived and idempotent, driven by
    # GitHub Actions cron (docs/ADR-002-scheduling.md); apscheduler was the always-on
    # deployment's dependency and nothing imported it.

    # Store. SQLAlchemy speaks the Postgres wire protocol, so the same code runs against
    # Supabase and against a bare postgres container in tests. supabase-py would need the
    # whole platform (PostgREST/GoTrue) up to test anything — see docs/ADR-001-store.md.
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pgvector>=0.3.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
# MetaTrader5 is Windows-only and needs a running terminal. Install with:
#   uv sync --extra mt5
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]

# The dashboard is the one long-lived process in the system, and the only one that needs a web
# server. Kept out of the base dependency set so the hourly Actions job — which installs with
# `--no-dev` and no extras — does not carry uvicorn and its C extensions for a pass that never
# serves a request. Install with `uv sync --extra dashboard`.
#
# uvicorn[standard] pulls uvloop, httptools and websockets. All three publish aarch64 wheels,
# which matters: the container is meant to run on Oracle's ARM instances, where a missing wheel
# means a compiler in the image rather than a failure.
dashboard = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

# LLM narration. LiteLLM routes to Gemini, Groq and NVIDIA NIM from one call signature, which
# is what lets `fxagent/agents/gateway.py` treat providers as a config table rather than as
# three clients. Install with `uv sync --extra llm`.
#
# An extra, not a base dependency, and imported inside the call that needs it rather than at
# module scope. Two things follow, both deliberate. The hourly Actions job and the Vercel
# bundle carry none of LiteLLM's dependency tree for a pass that may make no LLM call at all;
# and `fxagent.agents` imports without it, so the deterministic template floor — and the test
# that proves the pipeline completes with every provider unreachable — does not depend on the
# very library whose absence it exists to survive. With the extra uninstalled, narration
# degrades to templates exactly as it does when a key is missing or a provider is down.
llm = [
    "litellm>=1.55",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    # The dashboard suite exercises the real routes and the real socket through Starlette's
    # TestClient, so the extra is a dev dependency too — a UI whose behaviour is only ever
    # eyeballed is a UI with no tests.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Reads .github/workflows/*.yml in tests/test_workflows_name_real_modules.py. Declared
    # rather than leaned on transitively: that test guards against a stage silently doing
    # nothing, and it uses importorskip, so an undeclared parser would make it skip itself
    # into exactly the silence it exists to detect.
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A real installed distribution, not a sys.path accident. `import fxagent` then resolves
# by installed-package name and can never be shadowed by cwd ordering or by a colliding
# top-level package from another distribution.
packages = ["fxagent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode resolves test modules by path rather than by sys.path order, so no installed
# distribution shipping a top-level `tests` package can shadow ours. Originally added because
# vibe-trading-ai pulled in `caio`, which does exactly that; kept on its own merits now that
# hard rule 10 keeps that dependency out of this venv entirely.
addopts = "-q --import-mode=importlib -m 'not network'"
asyncio_mode = "auto"
# Postgres-backed tests skip themselves when TEST_DATABASE_URL is unset, so the suite stays
# runnable without Docker. `-m db` runs only those; `-m "not db"` is the no-container subset.
markers = [
    "db: requires a live Postgres with pgvector (see docker-compose.test.yml)",
    # Deselected by default (see addopts). These hit third-party servers, so they fail on a
    # plane and they fail when someone else's site is down — neither of which is our defect.
    # Run them deliberately, with `-m network`, when a feed's shape is in question.
    "network: reaches a real external feed over the internet",
    # Needs to spawn a fresh interpreter. Sandboxes and locked-down CI runners refuse that with
    # a PermissionError that says nothing about the code, so these skip with "could not verify"
    # rather than failing. Deselect them with `-m "not subprocess"` where spawning is never
    # available, so the skip does not become background noise of its own.
    "subprocess: spawns a fresh interpreter to measure a real import graph",
]

[project]
name = "fx-regime-agent"
version = "0.1.0"
description = "Session-aware forex regime agent: three uncorrelated strategies behind a regime router, executing only under an expiring permission grant."
readme = "README.md"
# pandas-ta dropped 3.11 support, so the plan's "3.11+" is no longer satisfiable.
# Upper bound excludes 3.13+, where several deps still lag (see docs/BUILD_PLAN.md pre-flight).
requires-python = ">=3.12,<3.13"

dependencies = [
    # Ceiling is vibe-trading-ai's (`pandas<3.0.0`); floor is pandas-ta's (`>=2.3.2`).
    # Pinned now so Phase 4 indicator code is written against the version we'll actually ship.
    "pandas>=2.3.2,<3",
    "pandas-ta>=0.4.71b0",
    "numpy>=2.2.6",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
# MetaTrader5 is Windows-only and needs a running terminal. Install with:
#   uv sync --extra mt5
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A real installed distribution, not a sys.path accident. `import fxagent` then resolves
# by installed-package name and can never be shadowed by cwd ordering or by a colliding
# top-level package from another distribution.
packages = ["fxagent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `caio` (a vibe-trading-ai transitive dep) ships a top-level `tests` package.
# importlib mode resolves test modules by path instead of by sys.path order,
# so a shared environment can never shadow ours.
addopts = "-q --import-mode=importlib"
